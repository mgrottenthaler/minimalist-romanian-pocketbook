<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>{{ site.Title }} — card social</title>
{{ $fonts := resources.Get "css/fonts.css" | resources.Minify }}
<link rel="stylesheet" href="{{ $fonts.RelPermalink }}">
<style>
  /* 600x315 at deviceScaleFactor 2 in scripts/gen-og-image.mjs -> 1200x630,
     the size og:image/twitter:image expect. Same palette and front-cover
     motif (red band + the "învățăm" specimen) as layouts/cover.html, just
     reflowed from the cover's portrait band into a landscape card. */
  :root {
    --serif: "Source Serif", Georgia, serif;
    --sans: "Source Sans", "Helvetica Neue", sans-serif;
    --cream: #fbf7ee;
    --ink: #1b1a17;
    --ink-soft: #5b574e;
    --red: #9a3324;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    position: relative;
    width: 600px;
    height: 315px;
    display: flex;
    background: var(--cream);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: lining-nums;
  }
  .band {
    flex: none;
    width: 212px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 22px;
    background: var(--red);
    color: var(--cream);
  }
  .kicker {
    margin: 0 0 10px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--cream) 78%, var(--red));
  }
  .title {
    margin: 0;
    font-size: 26px;
    line-height: 1.14;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .face {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 34px;
  }
  .specimen {
    margin: 0;
    font-family: var(--serif);
    font-size: 48px;
    line-height: 1.05;
  }
  .specimen .e { font-weight: 700; color: var(--red); }
  .specimen-caption {
    margin: 10px 0 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .url {
    position: absolute;
    right: 22px;
    bottom: 14px;
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="band">
  <p class="kicker">{{ site.Params.subtitle }}</p>
  <h1 class="title">{{ site.Title }}</h1>
</div>

<div class="face">
  <!-- Same convention as the cover: stem plain, ending picked out. -->
  <p class="specimen">învăț<span class="e">ăm</span></p>
  <p class="specimen-caption">gramatică esențială · nivel B2</p>
</div>

<p class="url">{{ site.Params.url }}</p>

</body>
</html>
