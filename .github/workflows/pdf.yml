name: Build PDF

# Same toolchain as `make pdf` (see README): hugo assembles content into
# public/index.html, scripts/build-pdf.mjs paginates it with paged.js and
# prints it with headless Chromium. Fonts are vendored in static/fonts/, so
# fetch-fonts.sh does not need to run here.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build PDF
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gramatica-romana-interior
          path: dist/gramatica-romana-interior.pdf

      - name: Attach PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gramatica-romana-interior.pdf
