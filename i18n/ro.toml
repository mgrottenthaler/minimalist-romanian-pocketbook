# UI-chrome strings read by the shared theme's layouts (themes/pocketbook-theme)
# via {{ i18n "key" }}. Book content itself (chapters, blurb, omits, subtitle)
# stays in content/ and hugo.toml [params] — this file is only the fixed
# wrapper text every page has regardless of which chapters it contains.
#
# A paragraph that contains a link is split at the link boundary (xPre, the
# link's own label, xPost) so the href stays in the template and only plain
# text lives here — see themes/pocketbook-theme/README.md for the full
# contract and where each piece lands on the page.

