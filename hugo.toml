baseURL = "/"
locale = "ro"
defaultContentLanguage = "ro"
title = "The Minimalist Romanian Pocketbook"

# robotsTXT stays disabled: static/robots.txt is a plain file instead (it
# only ever needs one "Allow: /" line, no templating). sitemap stays enabled
# — layouts/_default/sitemap.xml below emits the single home-page URL.
disableKinds = ["taxonomy", "term", "RSS", "robotsTXT", "section", "404"]

# The book is a single HTML document assembled by layouts/home.html and paged
# into a PDF by paged.js. Chapters stay in site.RegularPages (list = always) so
# the layout can gather them, but never get an output file of their own.
[[cascade]]
  [cascade.target]
    path = "/chapters/**"
  [cascade.build]
    render = "never"
    list = "always"

[params]
  subtitle = "gramatică esențială"
  # Back-cover copy and imprint line — see layouts/cover.html. In Romanian,
  # like the book itself; only the README is in English.
  blurb = "Paradigme, terminații și formarea timpurilor, cu cât mai puțină proză. O recapitulare pentru nivelul B2, nu un curs."
  omits = "Fără exerciții, fără vocabular, fără fonetică — numai formele."
  url = "https://romanian.grottenthaler.eu"
  repo = "github.com/mgrottenthaler/minimalist-romanian-pocketbook"
  lulu = "https://www.lulu.com/shop/martin-grottenthaler/the-minimalist-romanian-pocketbook/paperback/product-v82vvpy.html"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.typographer]
    disable = true
  [markup.goldmark.parser]
    autoHeadingID = true
    [markup.goldmark.parser.attribute]
      block = true
      title = true

[build]
  writeStats = false
